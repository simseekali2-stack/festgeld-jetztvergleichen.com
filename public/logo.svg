<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Vibrant Blue Gradient for Icon -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Accent Cyan Gradient for highlights -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow for Icon -->
    <filter id="blueShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d4ed8" flood-opacity="0.25" />
    </filter>
  </defs>

  <g id="LogoGroup">
    <!-- Icon Container: Rounded Squircle -->
    <rect x="10" y="12" width="56" height="56" rx="16" fill="url(#blueGradient)" filter="url(#blueShadow)" />
    
    <!-- Grid line overlays -->
    <line x1="20" y1="52" x2="56" y2="52" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="20" y1="40" x2="56" y2="40" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="20" y1="28" x2="56" y2="28" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Rising Trend Line / Growth Graph -->
    <path d="M 22 49 L 32 41 L 41 45 L 53 23" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrow Peak -->
    <polygon points="53,23 46,25 51,30" fill="#ffffff" />
    
    <!-- Glowing Dot at peak -->
    <circle cx="53" cy="23" r="4.5" fill="#38bdf8" />
    <circle cx="53" cy="23" r="2.5" fill="#ffffff" />

    <!-- Brand Typography -->
    <!-- "festgeld" - Deep Slate/Navy -->
    <text x="80" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="26" font-weight="900" fill="#0f172a" letter-spacing="-0.03em">festgeld</text>
    
    <!-- "-jetztvergleichen" - Vibrant Royal Blue -->
    <text x="180" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="26" font-weight="900" fill="#2563eb" letter-spacing="-0.03em">-jetztvergleichen</text>
    
    <!-- ".com" - Muted Cyan/Slate -->
    <text x="398" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="19" font-weight="800" fill="#0284c7" letter-spacing="-0.02em">.com</text>

    <!-- Subtitle / Tagline -->
    <text x="81" y="62" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#64748b" letter-spacing="0.18em" text-transform="uppercase">Europas Zins-Vergleich</text>
  </g>
</svg>
