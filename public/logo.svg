<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18283b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (Shield + Growth Chart + Euro Symbol) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#amberGrad)" />
    <!-- Shield Outline -->
    <path d="M30 12 C18 12, 14 18, 14 26 C14 40, 30 48, 30 48 C30 48, 46 40, 46 26 C46 18, 42 12, 30 12 Z" fill="none" stroke="#18283b" stroke-width="3" opacity="0.25"/>
    <!-- Growth Bars -->
    <rect x="20" y="34" width="5" height="12" rx="2" fill="#18283b"/>
    <rect x="27.5" y="28" width="5" height="18" rx="2" fill="#18283b"/>
    <rect x="35" y="20" width="5" height="26" rx="2" fill="#18283b"/>
    <!-- Euro Symbol Accent -->
    <text x="30" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#18283b" text-anchor="middle">€</text>
  </g>

  <!-- Brand Text -->
  <g transform="translate(82, 45)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="23" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      festgeld-<tspan fill="#e99f4c">jetztvergleichen</tspan><tspan fill="#94a3b8" font-size="16" font-weight="700">.com</tspan>
    </text>
    <text x="1" y="18" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="1.5">
      UNABHÄNGIGER ZINSVERGLEICH DEUTSCHLAND
    </text>
  </g>
</svg>
