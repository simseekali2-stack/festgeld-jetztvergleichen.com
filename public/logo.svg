<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Premium Orange Gradient (Solid style stops) -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    
    <!-- Light Glow Gradient -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for the Ticker Icon -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ea580c" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="LogoGroup">
    <!-- Icon Container: Rounded Squircle -->
    <rect x="10" y="12" width="56" height="56" rx="16" fill="url(#redGradient)" filter="url(#shadow)" />
    
    <!-- Ticker graph grid line -->
    <line x1="20" y1="52" x2="56" y2="52" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="20" y1="40" x2="56" y2="40" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="20" y1="28" x2="56" y2="28" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Ticker Rising Trend Line (Graph) -->
    <path d="M 22 50 L 32 42 L 42 45 L 53 22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Pulsing Arrow Peak / Bullish Indicator -->
    <polygon points="53,22 46,24 51,29" fill="#ffffff" />
    
    <!-- Glowing Dot at peak -->
    <circle cx="53" cy="22" r="4.5" fill="#fed7aa" />
    <circle cx="53" cy="22" r="2.5" fill="#ffffff" />

    <!-- Brand Typography -->
    <!-- "Tagesgeld" - Dark Slate, bold and modern -->
    <text x="80" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="27" font-weight="900" fill="#0f172a" letter-spacing="-0.03em">Tagesgeld</text>
    
    <!-- "Ticker" - High contrast Orange -->
    <text x="218" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="27" font-weight="900" fill="#f97316" letter-spacing="-0.03em">Ticker</text>
    
    <!-- ".com" - Sleek gray suffix -->
    <text x="300" y="47" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="19" font-weight="700" fill="#64748b" letter-spacing="-0.02em">.com</text>

    <!-- Subtitle / Tagline -->
    <text x="81" y="62" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#94a3b8" letter-spacing="0.2em" text-transform="uppercase">Top-Zinsen Live-Vergleich</text>
  </g>
</svg>
